<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Your App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="login-box">
                <div class="logo-section">
                    <h1>Welcome Back</h1>
                    <p>Log in to your account to continue</p>
                </div>

                <form id="loginForm" class="login-form" novalidate>
                    <!-- Alert Messages -->
                    <div id="successMessage" class="alert alert-success" style="display: none;">
                        <span id="successText"></span>
                    </div>
                    <div id="errorMessage" class="alert alert-error" style="display: none;">
                        <span id="errorText"></span>
                    </div>

                    <!-- Email/Username Input -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email or Username</label>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="Enter your email or username"
                            required
                            autocomplete="email"
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                class="toggle-password" 
                                id="togglePassword"
                                aria-label="Toggle password visibility"
                            >
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input 
                                type="checkbox" 
                                id="rememberMe" 
                                name="rememberMe"
                                class="checkbox-input"
                            >
                            <label for="rememberMe" class="checkbox-label">Remember me</label>
                        </div>
                        <a href="#forgot-password" class="forgot-password-link">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-button" id="submitBtn">
                        <span class="button-text">Login</span>
                        <span class="button-loader" style="display: none;">
                            <span class="spinner"></span>
                        </span>
                    </button>
                </form>

                <!-- Sign Up Link -->
                <div class="signup-section">
                    <p>Don't have an account? <a href="#signup" class="signup-link">Sign up here</a></p>
                </div>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Social Login Options -->
                <div class="social-login">
                    <button type="button" class="social-button google-btn">
                        <span class="social-icon">G</span>
                        <span class="social-text">Google</span>
                    </button>
                    <button type="button" class="social-button github-btn">
                        <span class="social-icon">⚙</span>
                        <span class="social-text">GitHub</span>
                    </button>
                </div>
            </div>

            <!-- Side Panel - Optional decorative element -->
            <div class="login-panel">
                <div class="panel-content">
                    <h2>Welcome to Our Platform</h2>
                    <p>Secure login with modern design and validation</p>
                    <ul class="features-list">
                        <li>✓ Secure authentication</li>
                        <li>✓ Easy to remember credentials</li>
                        <li>✓ 24/7 account access</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
