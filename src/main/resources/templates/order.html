<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <div class="ok" role="status" th:if="${param.placed}">
    <strong>Payment successful. Order confirmed.</strong> Thank you for your purchase! Keep this receipt for your records.</div>
  <section class="card receipt" aria-label="Order receipt">
    <h1 th:text="${param.placed} ? 'Order confirmation' : 'Order details'"></h1>
    <p><strong th:text="'Order #' + ${order.id}"></strong><br>
       <span class="muted" th:text="'Placed on ' + ${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')} + ' UTC'"></span></p>
    <p>Status: <strong th:text="${order.status}"></strong></p>
    <div th:if="${order.paymentReference != null}">
      <h2>Payment</h2>
      <p>Paid with <span th:text="${order.cardBrand} + ' ending in ' + ${order.cardLast4}"></span><br>
         <span class="muted" th:text="'Reference ' + ${order.paymentReference} + ' (simulated payment)'"></span></p>
    </div>
    <h2>Ship to</h2>
    <p class="address" th:text="${order.shippingAddress}"></p>
    <h2>Items</h2>
    <table>
      <thead><tr><th>Product</th><th>Qty</th><th>Unit price</th><th>Subtotal</th></tr></thead>
      <tr th:each="i : ${order.items}">
        <td th:text="${i.productName}"></td><td th:text="${i.quantity}"></td>
        <td th:text="${#numbers.formatDecimal(i.unitPrice,1,'COMMA',2,'POINT')}"></td>
        <td th:text="${#numbers.formatDecimal(i.lineTotal,1,'COMMA',2,'POINT')}"></td>
      </tr>
      <tr><th colspan="3" th:text="${order.paymentReference != null} ? 'Total paid' : 'Total'"></th><th th:text="${#numbers.formatDecimal(order.total,1,'COMMA',2,'POINT')}"></th></tr>
    </table>
    <p class="no-print"><button type="button" onclick="window.print()">Print receipt</button>
       <a th:href="@{/orders}">All orders</a> &middot; <a th:href="@{/}">Continue shopping</a></p>
  </section>
</main>
</body>
</html>
