<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Checkout')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <h1>Checkout</h1>
  <div class="alert" th:if="${error}" th:text="${error}"></div>
  <table>
    <tr th:each="l : ${lines}"><td th:text="${l.product.name} + ' x ' + ${l.quantity}"></td><td th:text="${l.lineTotal}"></td></tr>
    <tr><th>Total</th><th th:text="${total}"></th></tr>
  </table>
  <form th:action="@{/checkout}" method="post" class="form">
    <label for="address">Shipping address</label>
    <textarea id="address" name="address" rows="3" maxlength="300" required></textarea>
    <p class="muted">Payment is simulated: no card details are collected.</p>
    <button type="submit">Place order</button>
  </form>
</main>
</body>
</html>
