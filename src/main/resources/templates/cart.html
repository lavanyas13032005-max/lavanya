<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <h1>Your cart</h1>
  <p th:if="${lines.empty}">Your cart is empty. <a th:href="@{/}">Keep shopping</a></p>
  <table th:unless="${lines.empty}">
    <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead>
    <tbody>
      <tr th:each="l : ${lines}">
        <td th:text="${l.product.name}"></td>
        <td th:text="${l.product.price}"></td>
        <td>
          <form th:action="@{/cart/update}" method="post" class="inline">
            <input type="hidden" name="productId" th:value="${l.product.id}">
            <input type="number" name="quantity" th:value="${l.quantity}" min="0" max="99" aria-label="Quantity">
            <button type="submit">Update</button>
          </form>
        </td>
        <td th:text="${l.lineTotal}"></td>
        <td>
          <form th:action="@{/cart/remove}" method="post" class="inline">
            <input type="hidden" name="productId" th:value="${l.product.id}">
            <button type="submit" class="danger">Remove</button>
          </form>
        </td>
      </tr>
    </tbody>
    <tfoot><tr><th colspan="3">Total</th><th colspan="2" th:text="${total}"></th></tr></tfoot>
  </table>
  <p th:unless="${lines.empty}"><a class="btn" th:href="@{/checkout}">Checkout</a></p>
</main>
</body>
</html>
