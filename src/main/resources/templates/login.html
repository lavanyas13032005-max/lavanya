<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <h1>Log in</h1>
  <div class="alert" th:if="${param.error}">Invalid email or password.</div>
  <div class="ok" th:if="${param.registered}">Account created. Please log in.</div>
  <form th:action="@{/login}" method="post" class="form">
    <label for="username">Email</label>
    <input id="username" type="email" name="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>
    <p><button type="submit">Log in</button></p>
  </form>
</main>
</body>
</html>
