# Run with: java -jar app.jar --spring.profiles.active=postgres
# Connection details come from environment variables; no credentials are stored here.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
