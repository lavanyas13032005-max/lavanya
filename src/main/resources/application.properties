spring.application.name=shop
# Default: embedded H2 file database in ./data (no server needed).
spring.datasource.url=jdbc:h2:file:./data/shop
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
# Admin account is created at startup. Set ADMIN_PASSWORD, otherwise a random one is logged once.
app.admin.email=${ADMIN_EMAIL:admin@shop.local}
app.admin.password=${ADMIN_PASSWORD:}
